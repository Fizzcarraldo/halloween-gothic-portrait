<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>American Gothic · reagierendes Porträt</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0806" />
  <link rel="apple-touch-icon" href="icon-192.png" />
</head>
<body>
  <!-- Goldrahmen mit geschichteter Bühne: Hintergrund + zwei Figuren-Ebenen -->
  <div class="frame">
    <div class="stage" id="stage">
      <!-- Gemälde-Ebene: füllt den Screen (Querformat), Figuren skalieren mit -->
      <div class="painting" id="painting">
        <img class="bg" id="bg" src="assets/bg.jpg" alt="" />
        <!-- Figuren: Green-Screen-PNGs werden per Canvas gekeyt und hier gezeichnet -->
        <canvas class="figure frau" id="frau-canvas"></canvas>
        <canvas class="figure mann" id="mann-canvas"></canvas>
        <div class="vignette"></div>
      </div>
    </div>
  </div>

  <!-- Startknopf (Webcam braucht eine Nutzer-Geste) -->
  <div class="start" id="start">
    <button id="startBtn">▶ Porträt erwecken</button>
    <p class="hint">Braucht Kamera-Freigabe. Über http(s)/localhost, nicht als Datei.
    Taste <b>d</b> = Debug, <b>p</b> = Positionen justieren.</p>
  </div>

  <div class="status" id="status" hidden></div>

  <!-- Einstellungen: Personen-Auswahl + Positionieren -->
  <button class="gear" id="gear" title="Einstellungen">⚙</button>
  <div class="panel" id="panel" hidden>
    <label>Links <select id="sel-left"></select></label>
    <label>Rechts <select id="sel-right"></select></label>
    <label class="chk"><input type="checkbox" id="edit-chk" /> Positionieren (Figur ziehen · Mausrad = Größe)</label>
  </div>

  <video id="cam" playsinline muted hidden></video>
  <audio id="hmpf" src="assets/hmpf.mp3" preload="auto"></audio>

  <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));</script>
  <script type="module" src="app.js"></script>
</body>
</html>
